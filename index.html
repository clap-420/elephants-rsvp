<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Elephante Date Night RSVP</title>

<style>
:root {
  --cream: #fff9f5;
  --blush: #f4e2d8;
  --ink: #3b241d;
  --muted: #7a5a50;
  --gold: #b9855e;
  --line: #dfc8b9;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 14px;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 20% 0%, #fff 0 12%, transparent 13%),
    linear-gradient(145deg, var(--cream), var(--blush));
}

.wrap {
  max-width: 680px;
  margin: 0 auto;
}

.card {
  padding: 28px;
  background: #fffaf7f0;
  border: 1px solid var(--line);
  border-radius: 28px;
  box-shadow: 0 22px 55px #77513d25;
}

.eyebrow {
  text-align: center;
  font-size: .78rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
}

h1 {
  margin: 10px 0;
  text-align: center;
  font-size: clamp(2.35rem, 9vw, 4.8rem);
  font-weight: 500;
  font-style: italic;
  line-height: 1;
}

.sub {
  margin: 0 0 24px;
  text-align: center;
  color: var(--muted);
}

.event {
  margin-bottom: 22px;
  padding: 18px 0;
  text-align: center;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.event strong {
  font-size: 1.42rem;
}

.event div {
  margin-top: 6px;
  color: var(--muted);
}

.menu-link {
  display: inline-block;
  margin-top: 15px;
  padding: 11px 18px;
  color: var(--ink);
  background: #fff8f3;
  border: 1px solid var(--gold);
  border-radius: 999px;
  text-decoration: none;
  font-size: .94rem;
  font-weight: 700;
  transition: .15s ease;
}

.menu-link:hover {
  background: #f3e2d8;
  transform: translateY(-1px);
}

label.title {
  display: block;
  margin: 18px 0 9px;
  font-size: 1.04rem;
  font-weight: 700;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 14px 15px;
  font: inherit;
  color: var(--ink);
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  outline: none;
}

input[type="text"]:focus,
textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #b9855e22;
}

textarea {
  min-height: 92px;
  resize: vertical;
}

.options {
  display: grid;
  gap: 10px;
}

.option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
  transition: .15s ease;
}

.option:hover {
  border-color: var(--gold);
  transform: translateY(-1px);
}

.option input {
  accent-color: #8d5d45;
  transform: scale(1.15);
}

.time {
  min-width: 84px;
  font-weight: 700;
}

.desc {
  color: var(--muted);
  font-style: italic;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 15px 18px;
  color: #fff;
  background: var(--ink);
  border: 0;
  border-radius: 999px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.note {
  margin-top: 14px;
  text-align: center;
  color: var(--muted);
  font-size: .82rem;
}

.confirm {
  display: none;
  padding: 34px 12px;
  text-align: center;
}

.confirm .heart {
  font-size: 2.4rem;
}

.confirm h2 {
  margin: 8px 0;
  font-size: 2rem;
}

.confirm p {
  color: var(--muted);
  line-height: 1.55;
}

.error {
  display: none;
  margin-top: 14px;
  padding: 12px;
  color: #6e352b;
  background: #fff2ef;
  border: 1px solid #d7a69a;
  border-radius: 12px;
}
</style>
</head>

<body>
<div class="wrap">
  <section class="card">

    <div id="formView">
      <div class="eyebrow">Official Invitation</div>

      <h1>Pick a time for us ♡</h1>

      <div class="sub">
        You choose the time. I’ll handle the rest 😉
      </div>

      <div class="event">
        <strong>Elephante — Dallas</strong>
        <div>Friday, October 24</div>

        <a
          class="menu-link"
          href="https://www.elephanterestaurants.com/menus-dallas/"
          target="_blank"
          rel="noopener noreferrer"
        >
          View the Elephante Menu ↗
        </a>
      </div>

      <!-- Submitted to the public Apps Script web app -->
      <form
        id="rsvpForm"
        method="POST"
        action="https://script.google.com/macros/s/AKfycbzhMwMLWXnJyrMgIKB4rJQgsTyTwc9Tp8bKobKx-uqotWXLscWk1rp4K9rs4ODrHoEwCA/exec"
        target="hidden_iframe"
      >

        <label class="title" for="name">Your name</label>

        <input
          id="name"
          name="name"
          type="text"
          placeholder="Your name"
          maxlength="80"
          autocomplete="name"
          required
        >

        <label class="title">Preferred time</label>

        <div class="options">
          <label class="option">
            <input type="radio" name="preferred_time" value="6:30 PM">
            <span class="time">6:30 PM</span>
            <span class="desc">early dinner</span>
          </label>

          <label class="option">
            <input type="radio" name="preferred_time" value="7:30 PM">
            <span class="time">7:30 PM</span>
            <span class="desc">prime date-night hour</span>
          </label>

          <label class="option">
            <input type="radio" name="preferred_time" value="8:30 PM">
            <span class="time">8:30 PM</span>
            <span class="desc">late-night vibes</span>
          </label>

          <label class="option">
            <input type="radio" name="preferred_time" value="9:30 PM">
            <span class="time">9:30 PM</span>
            <span class="desc">fashionably late</span>
          </label>

          <label class="option">
            <input type="radio" name="preferred_time" value="Surprise me">
            <span class="time">Surprise me</span>
            <span class="desc">you decide ;)</span>
          </label>
        </div>

        <label class="title" for="looking_to_try">
          Anything you’re looking to try?
          <span style="font-weight:400;color:var(--muted)">(optional)</span>
        </label>

        <textarea
          id="looking_to_try"
          name="looking_to_try"
          maxlength="500"
          placeholder="Anything on the menu catching your eye? 👀"
        ></textarea>

        <label class="title" for="notes">
          Anything I should know?
          <span style="font-weight:400;color:var(--muted)">(optional)</span>
        </label>

        <textarea
          id="notes"
          name="notes"
          maxlength="500"
          placeholder="Anything you want to add..."
        ></textarea>

        <input
          type="hidden"
          id="client_time"
          name="client_time"
        >

        <div id="error" class="error"></div>

        <button id="submitBtn" type="submit">
          RSVP 💌
        </button>
      </form>

      <div class="note">
        Your response will be saved privately to the host’s RSVP sheet.
      </div>
    </div>

    <div class="confirm" id="confirmView">
      <div class="heart">🤍</div>
      <h2>It’s a date.</h2>
      <p>
        Your RSVP was sent.<br>
        I’ll handle the rest 😉
      </p>
    </div>

  </section>
</div>

<!-- Apps Script response loads here without leaving the page -->
<iframe
  id="hidden_iframe"
  name="hidden_iframe"
  style="display:none"
></iframe>

<script>
const form = document.getElementById("rsvpForm");
const errorBox = document.getElementById("error");
const submitBtn = document.getElementById("submitBtn");
const hiddenIframe = document.getElementById("hidden_iframe");

let formSubmitted = false;

form.addEventListener("submit", function (event) {
  const selectedTime =
    document.querySelector('input[name="preferred_time"]:checked');

  // Time selection is required before submission.
  if (!selectedTime) {
    event.preventDefault();

    errorBox.style.display = "block";
    errorBox.textContent = "Pick a time for us first 😉";
    return;
  }

  errorBox.style.display = "none";

  // Record the submitter's local date/time for the email and Sheet.
  document.getElementById("client_time").value =
    new Date().toLocaleString();

  submitBtn.disabled = true;
  submitBtn.textContent = "Sending RSVP…";

  formSubmitted = true;
});

// The hidden iframe loads once Apps Script returns its response.
hiddenIframe.addEventListener("load", function () {
  if (!formSubmitted) return;

  document.getElementById("formView").style.display = "none";
  document.getElementById("confirmView").style.display = "block";

  formSubmitted = false;
});
</script>

</body>
</html>
